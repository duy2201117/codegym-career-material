<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Bootstrap Forms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-wrapper py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                    <div class="card shadow registration-card">
                        <div class="card-body p-4 p-md-5">
                            <h1 class="text-center mb-2">Đăng ký tài khoản</h1>
                            <p class="text-muted text-center mb-4">Vui lòng nhập đầy đủ thông tin bên dưới.</p>

                            <form action="#" method="post">
                                <div class="mb-3">
                                    <label for="fullname" class="form-label">Họ và tên</label>
                                    <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nhập họ và tên" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                                    <div class="form-text">Chúng tôi sẽ không chia sẻ email của bạn với người khác.</div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <label for="password" class="form-label">Mật khẩu</label>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" minlength="6" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" minlength="6" required>
                                    </div>
                                </div>

                                <fieldset class="mb-3">
                                    <legend class="form-label mb-2">Giới tính</legend>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="male" value="Nam" required>
                                            <label class="form-check-label" for="male">Nam</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="female" value="Nữ">
                                            <label class="form-check-label" for="female">Nữ</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="other" value="Khác">
                                            <label class="form-check-label" for="other">Khác</label>
                                        </div>
                                    </div>
                                </fieldset>

                                <fieldset class="mb-3">
                                    <legend class="form-label mb-2">Sở thích</legend>
                                    <div class="row g-2">
                                        <div class="col-6 col-md-4">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" name="hobby" value="Công nghệ" id="technology">
                                                <label class="form-check-label" for="technology">Công nghệ</label>
                                            </div>
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" name="hobby" value="Thể thao" id="sports">
                                                <label class="form-check-label" for="sports">Thể thao</label>
                                            </div>
                                        </div>
                                        <div class="col-6 col-md-4">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" name="hobby" value="Du lịch" id="travel">
                                                <label class="form-check-label" for="travel">Du lịch</label>
                                            </div>
                                        </div>
                                    </div>
                                </fieldset>

                                <div class="mb-4">
                                    <label for="country" class="form-label">Quốc gia</label>
                                    <select class="form-select" id="country" name="country" required>
                                        <option value="" selected disabled>-- Chọn quốc gia --</option>
                                        <option value="Vietnam">Việt Nam</option>
                                        <option value="Japan">Nhật Bản</option>
                                        <option value="Korea">Hàn Quốc</option>
                                        <option value="USA">Hoa Kỳ</option>
                                    </select>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
